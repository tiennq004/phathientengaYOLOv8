<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | Fall Guard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  <script>
    (function () {
      try {
        if (localStorage.getItem("fallguard-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (_) {}
    })();
  </script>
</head>
<body class="login-page">
  <div class="login-bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <div class="floating-icons" aria-hidden="true">
    <div class="float-icon float-icon-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div class="float-icon float-icon-2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <div class="float-icon float-icon-3">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
    <div class="float-icon float-icon-4">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </div>
  </div>

  <button type="button" id="btnThemeLogin" class="login-theme-btn" title="Đổi giao diện" aria-label="Đổi giao diện">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <main class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg class="logo-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a10 10 0 1 0 10 10"/>
          <path d="M12 12l4-2"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
        </svg>
      </div>
      <h1>Fall Guard</h1>
      <p>Hệ thống phát hiện té ngã thông minh</p>
    </div>

    {% if error %}
    <div class="login-error" role="alert">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}" class="login-form">
      <input type="hidden" name="next" value="{{ next or '' }}" />
      <label class="field">
        <span class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" name="username" placeholder="Tên đăng nhập" required autocomplete="username" />
      </label>
      <label class="field">
        <span class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="passwordInput" name="password" placeholder="Mật khẩu" required autocomplete="current-password" />
        <button type="button" id="btnTogglePwd" class="pwd-toggle" aria-label="Hiện mật khẩu" title="Hiện/ẩn mật khẩu">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/></svg>
        </button>
      </label>
      <button type="submit" class="btn-login">
        <span>Đăng nhập</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </main>

  <footer class="login-footer">© 2025 Khoa CNTT — Đại học Đại Nam · AIoTLab</footer>
  <script>
    (function () {
      var btn = document.getElementById("btnThemeLogin");
      if (btn) {
        btn.addEventListener("click", function () {
          var dark = document.documentElement.getAttribute("data-theme") === "dark";
          if (dark) {
            document.documentElement.removeAttribute("data-theme");
            localStorage.setItem("fallguard-theme", "light");
          } else {
            document.documentElement.setAttribute("data-theme", "dark");
            localStorage.setItem("fallguard-theme", "dark");
          }
        });
      }
      var pwd = document.getElementById("passwordInput");
      var toggle = document.getElementById("btnTogglePwd");
      if (pwd && toggle) {
        toggle.addEventListener("click", function () {
          var show = pwd.type === "password";
          pwd.type = show ? "text" : "password";
          toggle.querySelector(".eye-open").classList.toggle("hidden", show);
          toggle.querySelector(".eye-closed").classList.toggle("hidden", !show);
        });
      }
    })();
  </script>
</body>
</html>
